name: Vérification Portfolio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-files:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la présence d'index.html
        run: test -f index.html && echo "index.html est bien présent !"

      - name: Vérifier la syntaxe HTML
        run: npx --yes htmlhint index.html
